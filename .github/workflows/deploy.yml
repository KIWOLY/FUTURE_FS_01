name: CI/CD - Build, Push to Docker Hub, and Deploy to Oracle Cloud

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allows manual triggering of the workflow from the GitHub Actions tab

env:
  IMAGE_NAME: kiwoly/portfolio

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up QEMU for multi-architecture builds
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 3. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5. Extract metadata for tagging
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      # 6. Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .        # Build context is the root of the repository
          push: true        # Push the image to Docker Hub after building
          platforms: linux/amd64,linux/arm64    # Build for both AMD64 and ARM64 architectures
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

           # Pass build arguments for EmailJS configuration
          build-args: |
            VITE_EMAILJS_PUBLIC_KEY=${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
            VITE_EMAILJS_SERVICE_ID=${{ secrets.VITE_EMAILJS_SERVICE_ID }}
            VITE_EMAILJS_TEMPLATE_ID=${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}

      # 7. Deploy to Oracle Cloud VPS
      - name: Deploy to Oracle Cloud VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            echo "Pulling latest Docker image..."
            docker pull ${{ env.IMAGE_NAME }}:latest

            echo "Stopping and removing existing container..."
            docker stop portfolio || true
            docker rm portfolio || true

            echo "Running new container..."
            docker run -d \
              --name portfolio \
              -p 80:80 \
              --restart unless-stopped \
              ${{ env.IMAGE_NAME }}:latest

            echo "Cleaning up unused images..."
            docker image prune -af